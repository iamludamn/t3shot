<!doctype html>
<!-- 演示舞台：一个「浏览器窗口」里打开 acme-login-demo 的登录页（样式直接引用该项目的 styles.css）。
     用 browser-use 以 1920x1080 截图，作为 T3Shot --demo 的 T3SHOT_DEMO_BG。 -->
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/ludamn/projects/acme-login-demo/styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body.stage { background: radial-gradient(1200px 800px at 20% 10%, #3b4a7a 0%, transparent 60%),
                           radial-gradient(1000px 700px at 90% 90%, #7a3b5c 0%, transparent 55%), #1a1c28 !important;
               font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  .win { position: absolute; left: 160px; top: 70px; width: 1600px; height: 930px; border-radius: 14px; overflow: hidden;
         box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); background: #101114; }
  .bar { height: 52px; background: #26272d; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid #000; }
  .dots i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
  .url { flex: 1; max-width: 640px; margin: 0 auto; height: 30px; border-radius: 8px; background: #1a1b20; color: #9a9ba3;
         font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .viewport { zoom: 1.45; background: var(--bg); height: calc((930px - 53px) / 1.45); overflow: hidden; color: var(--text); }
  .viewport .card { margin-top: 48px; }
</style></head>
<body class="stage">
  <div class="win">
    <div class="bar"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
      <div class="url">localhost:8000 — Acme 登录</div><span style="width:60px"></span></div>
    <div class="viewport">
      <main class="card">
        <h1>登录 Acme</h1>
        <label for="email">邮箱</label>
        <input id="email" type="email" value="demo@acme.com">
        <label for="password">密码</label>
        <input id="password" type="password" value="12345678">
        <button class="btn-primary" type="submit">登录</button>
        <a class="link-muted" href="#">忘记密码？</a>
      </main>
    </div>
  </div>
</body></html>
